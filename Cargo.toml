[workspace]
resolver = "2"
members = ["crates/nook-core", "crates/nook-release", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Proprietary"
authors = ["Nook"]
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
futures = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "gzip", "brotli", "deflate", "blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
regex = "1"
rand = "0.8"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
