# Every push and pull request: the Rust and UI checks on Windows, then the installer as an artifact.
# The same checks run locally in tools/pipeline.ps1 (tools/publish.ps1 -Test) before a build is
# published to an update feed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Test and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install npm packages
        run: |
          npm ci
          npm --prefix ui ci

      - name: UI typecheck, tests and build
        working-directory: ui
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  bundle:
    name: Installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install npm packages
        run: |
          npm ci
          npm --prefix ui ci

      - name: Build the installer
        env:
          NOOK_COMMIT: ${{ github.sha }}
        run: npx tauri build --ci

      - uses: actions/upload-artifact@v4
        with:
          name: nook-setup-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
