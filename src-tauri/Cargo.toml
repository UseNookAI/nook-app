[package]
name = "nook"
description = "Nook: private and secure AI on your GPU"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "nook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nook-core = { path = "../crates/nook-core" }
# macos-private-api: the screen recorder's picker and controls are see-through windows, which
# macOS gives only through its private API (fine outside the Mac App Store); nothing on Windows.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
parking_lot.workspace = true
