[package]
name = "nook-core"
description = "Nook's engine room: the local runtime, the Code worker, sessions, the gateway, video, updates. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
bytes.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
url.workspace = true
regex.workspace = true
rand.workspace = true
# Archives (engine zips), the gateway, signatures, diffs, HTML, walking trees.
zip = { version = "2", default-features = false, features = ["deflate"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
similar = "2"
scraper = "0.22"
html-escape = "0.2"
encoding_rs = "0.8"
walkdir = "2"
ignore = "0.4"
globset = "0.4"
sysinfo = "0.33"
once_cell = "1"
async-trait = "0.1"
# The Read aloud Nooklet: which language a text is in, for its voice.
whatlang = "0.16"
# Voice prompt capture.
cpal = "0.15"
hound = "3"
# Flows: reading recordings, podcasts and videos' sound (MP3, AAC/M4A/MP4, FLAC, Vorbis, WAV,
# AIFF, CAF, MKV/WebM) without FFmpeg.
symphonia = { version = "0.5", features = ["all"] }
# Flows: the PDF editor. PDFium (Chrome's PDF engine) is downloaded like an engine and bound at
# run time; its pages are handed to the page as PNG.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "ico"] }
# The document converter's tables: workbooks read (Excel's, OpenDocument's), written (Excel's),
# and CSV.
calamine = { version = "0.36", features = ["dates"] }
rust_xlsxwriter = "0.99"
csv = "1"
# Text drawn as pixels: the likely fonts are drawn to compare with it.
ab_glyph = "0.2"
# PDFium comes as a .tgz.
flate2 = "1"
tar = "0.4"
# The worker's web access: walking and pruning a parsed page (scraper's tree), PDFs as text,
# the Accept-Language a browser would send.
ego-tree = "0.10"
pdf-extract = "0.12"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Windows' own text recognition, for text that is part of a picture in a PDF.
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[target.'cfg(unix)'.dependencies]
# The reaper of engine processes (process.rs): kqueue and signals.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Apple silicon's GPU: its name and the working set Metal recommends, for the model planner.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice"] }
# The PDF editor's text in pictures: Apple's Vision reads it, from a CGImage of the page.
objc2-vision = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
# The screen recorder: ScreenCaptureKit captures a screen, a window or an area and the Mac's own
# sound; its frames (CoreMedia sample buffers holding CoreVideo pixel buffers) go to FFmpeg.
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-audio-types = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
# Stream keys in the login keychain.
security-framework = "3"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# A fake web server that gzips a page it was not asked to (web access tests).
flate2 = "1"
